<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elyx - The Healthcare You Deserve</title>
    <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
    <link rel="shortcut icon" href="./favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./favicon/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Forum&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Work Sans', serif;
        background-color: #c6af89;
        color: #1878e7;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        text-align: center;
        background-color: #ffffff;
        padding: 120px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .clinic-name {
        font-size: 40px;
        margin-top: 20px;
        margin-bottom: 20px;
        width: 200px;
      }
      .tagline {
        margin-top: 10px;
        font-size: 30px;
        color: #1878e7;
        font-family: "Forum", serif;
        /* font-family: "Forum", serif; */
      }
      .invite-only {
        font-size: 18px;
        color: #c6af89;
        margin-top: 80px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="./images/elyx-logo-black.svg" alt="Elyx" class="clinic-name" />
      <div class="tagline">The Healthcare You Deserve</div>
      <div class="invite-only">By Invite Only.</div>
    </div>
  </body>
</html>
