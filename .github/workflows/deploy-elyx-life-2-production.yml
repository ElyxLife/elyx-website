name: Deploy Elyx Life 2 (Production)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: elyx-life-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: ap-southeast-1
      S3_BUCKET: ${{ vars.ELYX_LIFE_2_S3_BUCKET }}
      CLOUDFRONT_DIST_ID: ${{ vars.ELYX_LIFE_2_CLOUDFRONT_DIST_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ELYX_LIFE_2_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static assets (long cache)
        run: |
          aws s3 sync assets/ s3://${{ env.S3_BUCKET }}/assets/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude ".DS_Store"

      - name: Sync site files (short cache)
        run: |
          aws s3 sync . s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=3600" \
            --exclude ".git/*" \
            --exclude ".DS_Store" \
            --exclude "assets/*" \
            --exclude "README.md" \
            --exclude "how-we-work" \
            --exclude "the-team" \
            --exclude "perspectives" \
            --exclude "membership" \
            --exclude "media-center" \
            --exclude "location" \
            --exclude "enquire" \
            --exclude "careers" \
            --exclude "careers/*" \
            --exclude "thank-you" \
            --exclude "journal/*" \
            --exclude "journal" \
            --exclude "support" \
            --exclude "privacy"

      - name: Publish clean URL aliases
        run: |
          # Serve each page at a clean, extensionless URL (no duplicated source files).
          publish() {
            aws s3 cp "$1" "s3://${{ env.S3_BUCKET }}/$2" \
              --cache-control "public, max-age=3600" \
              --content-type "text/html; charset=utf-8"
          }
          publish Intelligence.dc.html how-we-work
          publish WhoWeAre.dc.html the-team
          publish Perspectives.dc.html perspectives
          publish Membership.dc.html membership
          publish MediaCenter.dc.html media-center
          publish Location.dc.html location
          publish Inquiry.dc.html enquire
          publish Careers.dc.html careers
          publish Job-HeadOfEngineering.dc.html careers/head-of-engineering
          publish Job-FullStackEngineer.dc.html careers/full-stack-engineer
          publish Job-HealthspanProductManager.dc.html careers/healthspan-product-manager
          publish Job-ExecutiveHealthspanConcierge.dc.html careers/executive-healthspan-concierge
          publish ThankYou.dc.html thank-you
          publish Journal-Price-of-Staying-Capable.dc.html journal/the-price-of-staying-capable
          publish Journal-Signal-and-Noise.dc.html journal/signal-and-noise
          publish Journal-L-Theanine.dc.html journal/l-theanine
          publish Journal-Index.dc.html journal
          publish Journal-Stop-Romanticizing-Death.dc.html journal/stop-romanticizing-death
          publish Support.dc.html support
          publish Privacy.dc.html privacy

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
