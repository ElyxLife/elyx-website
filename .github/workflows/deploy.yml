name: Build & Deploy to S3

on:
  push:
    branches: [main]
    paths:
      - 'elyx360-site/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  S3_BUCKET: 360-elyx-life-static
  CLOUDFRONT_DIST_ID: E3FDAE39VEYN3X

defaults:
  run:
    working-directory: elyx360-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: elyx360-site

      - name: Build Jekyll site
        run: JEKYLL_ENV=production bundle exec jekyll build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static assets (long cache)
        run: |
          aws s3 sync _site/assets/ s3://${{ env.S3_BUCKET }}/assets/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude ".DS_Store"

      - name: Sync everything else (short cache)
        run: |
          aws s3 sync _site/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=3600" \
            --exclude ".git/*" \
            --exclude ".DS_Store" \
            --exclude "assets/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
