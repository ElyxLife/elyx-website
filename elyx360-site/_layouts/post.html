---
layout: default
---

<article class="section" style="padding-top: 150px;">
  <div style="max-width: 800px; margin: 0 auto;">
    <header style="margin-bottom: 48px; text-align: center;">
      <h1 style="font-size: 48px; margin-bottom: 16px; line-height: 1.2;">{{ page.title }}</h1>
      <div style="color: #808080; font-size: 16px;">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
        {% if page.author %} • {{ page.author }}{% endif %}
      </div>
    </header>

    {% if page.image %}
    <div style="margin-bottom: 48px; border-radius: 12px; overflow: hidden;">
      <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" style="width: 100%; display: block;">
    </div>
    {% endif %}

    <div style="line-height: 1.8; color: #B8B8B8;" class="post-content">
      {{ content }}
    </div>
  </div>
</article>
